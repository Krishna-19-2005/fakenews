<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection</title>
    <style>
        /* Apply box-sizing globally */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Base styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Header styling */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #2980b9;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            position: relative;
            color: white;
        }

        #history-icon {
            font-size: 1.5rem;
            cursor: pointer;
        }

        #title-container {
            text-align: center;
            flex-grow: 1;
        }

        #header h1 {
            font-size: 2.5rem;
        }

        #header p {
            font-size: 1.2rem;
            font-style: italic;
        }

        #account-info {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            cursor: pointer;
            color: white;
        }

        #account-icon {
            font-size: 1.7rem;
            background-color: #bdc3c7;
            border-radius: 50%;
            padding: 12px;
            margin-left: 10px;
            transition: background-color 0.3s ease;
        }

        #account-icon:hover {
            background-color: #3498db;
        }

        #account-name {
            font-weight: bold;
            margin-left: 10px;
        }

        /* Sidebar styling */
        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            height: 100%;
            transition: left 0.3s ease-in-out;
        }

        #sidebar h3 {
            color: #2980b9;
            text-align: center;
            margin-bottom: 15px;
        }

        #history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #history-list li {
            padding: 12px;
            background-color: #bdc3c7;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #history-list li:hover {
            background-color: #3498db;
            color: white;
        }

        /* Content container styling */
        .container {
            padding: 40px 20px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        .input-output-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #input-box,
        #output-box {
            padding: 25px;
            background-color: #ecf0f1;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            min-width: 300px;
            max-width: 400px;
            text-align: center;
        }

        #input-box input {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 1.1rem;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
        }

        #output-box h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: #2980b9;
        }

        #output {
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            font-size: 1.2rem;
            color: #333;
        }

        #bottom {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #3498db;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .input-output-container {
                flex-direction: column;
            }

            #input-box,
            #output-box {
                width: 100%;
            }

            button {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div id="header">
        <div id="history-icon" onclick="toggleSidebar()">&#128194; History</div>
        <div id="title-container">
            <h1>Fake News Detection</h1>
            <p>Verify the truth before you share</p>
        </div>
        <div id="account-info">
            <a href="account.html">
                <div id="account-icon">&#128100;</div>
                <div id="account-name">John Doe</div>
            </a>
        </div>
    </div>

    <div class="container">
        <div class="main-content">
            <div class="input-output-container">
                <div id="input-box">
                    <h3>Enter the News</h3>
                    <input type="text" id="news-input" placeholder="Enter the news here">
                </div>

                <div id="output-box">
                    <h3>Verification Result</h3>
                    <div id="output">
                        Output will appear here
                    </div>
                </div>
            </div>

            <div id="bottom">
                <button id="verify">Verify</button>
                <button id="copy">Copy</button>
                <button id="share">Share</button>
                <button id="save">Save</button>
                <button id="clear">Clear</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('verify').addEventListener('click', function () {
            var newsInput = document.getElementById('news-input').value;
            if (newsInput.trim() !== '') {
                fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'news_input=' + encodeURIComponent(newsInput)
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('output').textContent = 'Prediction: ' + data.prediction;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('There was an error processing your request');
                });
            } else {
                alert('Please enter some news text.');
            }
        });
    </script>
</body>

</html>
